<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Strike - Gestionnaire de Partie</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --panel-bg: #2a2a35;
            --accent-orange: #ff6b00;
            --accent-green: #4caf50;
            --text-main: #e0e0e0;
            --border-color: #3f3f50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-orange);
            margin-top: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Tracker de tour */
        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .turn-display {
            font-size: 1.5em;
            font-weight: bold;
        }

        .phase-display {
            font-size: 1.2em;
            color: var(--accent-green);
        }

        button {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--accent-orange);
            color: white;
        }

        button.primary {
            background-color: var(--accent-green);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        button.primary:hover {
            background-color: #45a049;
        }

        /* Calculateur */
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 5px 0;
            border-bottom: 1px dashed #3f3f50;
        }

        label {
            font-weight: bold;
            flex-grow: 1;
        }

        select, input[type="number"] {
            background-color: #12121a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
            width: 200px;
            font-size: 1em;
        }

        .result-box {
            background-color: #12121a;
            border: 2px solid var(--accent-orange);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .result-number {
            font-size: 3em;
            font-weight: bold;
            color: var(--accent-orange);
            margin: 10px 0;
        }

        .warning {
            color: #ff5252;
            font-size: 0.9em;
            display: none;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Section de Suivi des Tours -->
    <div class="panel">
        <h1>Gestionnaire de Partie</h1>
        <div class="tracker-header">
            <div class="turn-display">Tour: <span id="turnCounter">1</span></div>
            <div class="phase-display" id="phaseDisplay">Phase: Initiative</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="prevPhase()">Phase Précédente</button>
            <button onclick="nextPhase()" style="flex-grow: 1;">Phase Suivante</button>
        </div>
    </div>

    <!-- Section du Calculateur de Combat -->
    <div class="panel">
        <h2>Calculateur de Modificateurs</h2>
        
        <div class="form-group">
            <label for="skill">Compétence du Tireur (Skill)</label>
            <input type="number" id="skill" value="4" min="0" max="8" onchange="calculate()">
        </div>

        <div class="form-group">
            <label for="attackerMove">Mouvement du Tireur</label>
            <select id="attackerMove" onchange="calculate()">
                <option value="0">Immobile / Au sol (+0)</option>
                <option value="2">Saut (Jumping) (+2)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="targetTMM">Modificateur de Mouvement Cible (TMM)</label>
            <input type="number" id="targetTMM" value="1" min="0" max="6" onchange="calculate()">
        </div>

        <div class="form-group">
            <label for="targetMoveType">Type de Mouvement Cible</label>
            <select id="targetMoveType" onchange="calculate()">
                <option value="0">Standard (+0)</option>
                <option value="1">Cible a sauté (+1)</option>
                <option value="-2">Cible immobile (-2)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="range">Portée (Range)</label>
            <select id="range" onchange="calculate()">
                <option value="0">Courte (0-6") (+0)</option>
                <option value="2">Moyenne (6-24") (+2)</option>
                <option value="4">Longue (24-42") (+4)</option>
                <option value="6">Extrême (>42") (+6)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="terrain">Terrain / Couvert</label>
            <select id="terrain" onchange="calculate()">
                <option value="0">Aucun (+0)</option>
                <option value="1">Bois clairs / Couvert partiel (+1)</option>
                <option value="2">Bois denses (+2)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="misc">Autres Modificateurs (Chaleur, Dégâts...)</label>
            <input type="number" id="misc" value="0" onchange="calculate()">
        </div>

        <div class="result-box">
            <div>Résultat requis sur 2D6 pour toucher</div>
            <div class="result-number" id="finalResult">7</div>
            <div class="warning" id="warningText">Tir Impossible ! (13+)</div>
        </div>

        <button class="primary" onclick="resetCalculator()">Réinitialiser le calcul</button>
    </div>
</div>

<script>
    // === GESTION DU TOUR ET DES PHASES ===
    let currentTurn = 1;
    const phases = [
        "Initiative", 
        "Mouvement", 
        "Combat", 
        "Fin de Tour"
    ];
    let currentPhaseIndex = 0;

    function updateTrackerUI() {
        document.getElementById('turnCounter').innerText = currentTurn;
        document.getElementById('phaseDisplay').innerText = `Phase: ${phases[currentPhaseIndex]}`;
    }

    function nextPhase() {
        currentPhaseIndex++;
        if (currentPhaseIndex >= phases.length) {
            currentPhaseIndex = 0;
            currentTurn++;
        }
        updateTrackerUI();
    }

    function prevPhase() {
        currentPhaseIndex--;
        if (currentPhaseIndex < 0) {
            if (currentTurn > 1) {
                currentTurn--;
                currentPhaseIndex = phases.length - 1;
            } else {
                currentPhaseIndex = 0; // Bloque au tour 1, phase 0
            }
        }
        updateTrackerUI();
    }

    // === GESTION DU CALCULATEUR DE COMBAT ===
    function calculate() {
        // Récupération des valeurs
        const skill = parseInt(document.getElementById('skill').value) || 0;
        const attackerMove = parseInt(document.getElementById('attackerMove').value) || 0;
        const targetTMM = parseInt(document.getElementById('targetTMM').value) || 0;
        const targetMoveType = parseInt(document.getElementById('targetMoveType').value) || 0;
        const range = parseInt(document.getElementById('range').value) || 0;
        const terrain = parseInt(document.getElementById('terrain').value) || 0;
        const misc = parseInt(document.getElementById('misc').value) || 0;

        // Calcul du total
        const toHit = skill + attackerMove + targetTMM + targetMoveType + range + terrain + misc;

        // Affichage
        const resultElement = document.getElementById('finalResult');
        const warningElement = document.getElementById('warningText');

        resultElement.innerText = toHit;

        // Logique visuelle selon la difficulté
        if (toHit > 12) {
            resultElement.style.color = '#ff5252'; // Rouge
            warningElement.style.display = 'block';
        } else if (toHit <= 12 && toHit >= 10) {
            resultElement.style.color = '#ffa726'; // Orange
            warningElement.style.display = 'none';
        } else {
            resultElement.style.color = 'var(--accent-green)'; // Vert
            warningElement.style.display = 'none';
        }
    }

    function resetCalculator() {
        document.getElementById('skill').value = 4;
        document.getElementById('attackerMove').value = 0;
        document.getElementById('targetTMM').value = 1;
        document.getElementById('targetMoveType').value = 0;
        document.getElementById('range').value = 0;
        document.getElementById('terrain').value = 0;
        document.getElementById('misc').value = 0;
        calculate();
    }

    // Initialisation au chargement de la page
    window.onload = function() {
        updateTrackerUI();
        calculate();
    };
</script>

</body>
</html>
